name: DEC Market Making Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests beem
      
      - name: Run Bot
        env:
          HIVE_USERNAME: ${{ secrets.HIVE_USERNAME }}
          HIVE_ACTIVE_KEY: ${{ secrets.HIVE_ACTIVE_KEY }} # ⚠️ DEĞİŞTİ
          TRADE_AMOUNT: ${{ secrets.TRADE_AMOUNT }}
          CHECK_INTERVAL: ${{ secrets.CHECK_INTERVAL }}
        run: |
          echo "🚀 Market Making Bot başlatılıyor (ACTIVE KEY ile)..."
          python -u bot.py
